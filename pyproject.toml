[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timebraid-model"
version = "0.1.0.dev0"
description = "TimeBraid: Unifying Time Series and Language for Understanding and Forecasting"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "accelerate==1.11.0",
  "huggingface-hub==0.36.2",
  "numpy==2.1.3",
  "safetensors==0.5.3",
  "tokenizers==0.22.2",
  "torch==2.10.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
notebook = [
  "matplotlib==3.10.8",
]
test = [
  "pytest==9.0.2",
  "ruff==0.15.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["timebraid*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
exclude = ["src/timebraid/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
